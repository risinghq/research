[settings.python]
uv_venv_auto = true

[tools]
python = "3.15.2"
uv = "0.13.7"

[tasks.install]
description = "Install every workspace package and its dependencies from the lockfile"
alias = "i"
run = "uv sync --all-packages --locked"

[tasks.fix]
description = "Format and lint-fix the Python code"
alias = "f"
run = [
    "uv run ruff format .",
    "uv run ruff check . --fix --unsafe-fixes",
]

[tasks.check]
description = "Every check CI runs: lint, format, types and tests"
alias = "c"
run = [
    "uv run ruff check . --no-fix",
    "uv run ruff format --check .",
    "uv run mypy .",
    "uv run pytest -q",
]
