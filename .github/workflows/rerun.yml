name: rerun

# Reruns the live replications and commits what changed. BLS publishes at 8:30
# Eastern on weekdays; 15:30 UTC is after it in both summer and winter time.
on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rerun

jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - run: mise run install
      - run: |
          uv run studies/us-payrolls/us_payrolls.py
          uv run studies/us-cpi/us_cpi.py
          uv run studies/us-ppi/us_ppi.py
          uv run studies/us-productivity/us_productivity.py
          uv run studies/us-beef-prices/us_beef_prices.py
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      - run: '.github/scripts/commit-changes "studies: rerun the live replications"'
        env:
          GH_TOKEN: ${{ github.token }}
