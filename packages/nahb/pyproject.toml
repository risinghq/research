[project]
name = "nahb"
version = "0.1.0"
description = "Reads the NAHB/Wells Fargo Housing Market Index history from NAHB's site."
requires-python = ">=3.14"
dependencies = [
    "httpx2",
    "pandas",
    "python-calamine>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
