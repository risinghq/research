[project]
name = "bvl"
version = "0.1.0"
description = "Lima Stock Exchange (BVL) panel from the SMV and BCRP APIs, and the tools its studies share."
requires-python = ">=3.14"
dependencies = [
    "bcrp",
    "matplotlib",
    "numpy",
    "pandas",
    "smv",
]

[project.scripts]
bvl = "bvl.cli:main"

[tool.uv.sources]
bcrp = { workspace = true }
smv = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
