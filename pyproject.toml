[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# `select`, not `extend-select`, so a new ruff default cannot add rules.
# E4, E7, E9 and F are ruff's classic default set.
select = [
    "E4",  # pycodestyle: import rules
    "E7",  # pycodestyle: statement rules
    "E9",  # pycodestyle: runtime errors
    "F",   # pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ERA", # eradicate
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TC",  # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
]
extend-safe-fixes = ["TC"]

[tool.ruff.lint.flake8-tidy-imports]
# Absolute imports only.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = false
lines-between-types = 1
lines-after-imports = 2

[tool.mypy]
python_version = "3.14"
strict = true
namespace_packages = true
explicit_package_bases = true
# A study folder's name has a hyphen, so each study module is top level.
mypy_path = [
    "packages/bcrp",
    "packages/bls",
    "packages/bvl",
    "packages/figures",
    "packages/mef",
    "packages/nahb",
    "packages/replication",
    "packages/smv",
    "studies/bvl-brokers",
    "studies/bvl-disclosure",
    "studies/bvl-earnings",
    "studies/bvl-liquidity",
    "studies/bvl-ownership",
    "studies/bvl-politics",
    "studies/peru-private-investment",
    "studies/peru-universities-budget",
    "studies/peru-universities-rankings",
    "studies/us-beef-prices",
    "studies/us-cpi",
    "studies/us-homebuilder-sentiment",
    "studies/us-payrolls",
    "studies/us-ppi",
    "studies/us-productivity",
]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist loadfile --strict-markers"
